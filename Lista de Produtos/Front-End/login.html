<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <h1>Login</h1>

            <p>Entre na sua conta</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="login"
                    placeholder="Login"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p id="mensagem"></p>

            <a href="cadastro.html">
                Criar uma conta
            </a>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
