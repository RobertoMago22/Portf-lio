<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Produtos</h1>
        <p>Controle de produtos da loja</p>
    </header>


    <main>

        <!-- CADASTRO -->

        <section class="card">

            <h2>Cadastrar Produto</h2>

            <form id="produtoForm">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome do produto"
                    required
                >

                <input
                    type="number"
                    id="preco"
                    placeholder="Preço"
                    step="0.01"
                    required
                >

                <input
                    type="number"
                    id="quantidade"
                    placeholder="Quantidade"
                    required
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>


        <!-- BUSCA -->

        <section class="card">

            <h2>Pesquisar Produto</h2>

            <div class="busca">

                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Digite o nome do produto"
                >

                <button onclick="buscarProdutos()">
                    Buscar
                </button>

                <button onclick="listarProdutos()">
                    Listar Todos
                </button>

            </div>

        </section>


        <!-- LISTAGEM -->

        <section class="card">

            <h2>Produtos</h2>

            <div id="mensagem"></div>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>

                </thead>

                <tbody id="tabelaProdutos">

                </tbody>

            </table>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
